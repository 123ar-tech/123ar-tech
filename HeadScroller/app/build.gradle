plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    compileSdk 35

    defaultConfig {
        applicationId "com.headscroller.headscroller"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"

        // Permissions for camera and accessibility
        manifestPermissions += [
            "android.permission.CAMERA",
            "android.permission.FOREGROUND_SERVICE",
            "android.permission.BIND_ACCESSIBILITY_SERVICE",
        ]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:2.0.0'
    // CameraX
    implementation 'androidx.camera:camera-core:1.3.6'
    implementation 'androidx.camera:camera-view:1.0.0'
    implementation 'androidx.camera:camera-lifecycle:1.3.2'
    implementation 'androidx.camera:camera2:1.3.6'
    // ML Kit Face Detection
    implementation 'com.google.mlkit:face-detection:17.2.0'
    // Coil for image loading (if needed)
    implementation 'coil-ktx:coil-androidx:2.3.0'
}